name: Release

# Manual release. It checks that the input equals the version in package.json, runs the full check,
# and creates a tag and a GitHub release with generated notes.
#
# Publishing to npm is a second job that is off unless the "publish" input is true. It uses npm
# trusted publishing (OIDC), so no npm token is stored in the repository. It needs a trusted
# publisher configured on npmjs.com for this repository and this workflow file (release.yml).
# See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0. Must equal package.json."
        required: true
        type: string
      publish:
        description: "Also publish the package to npm (needs a trusted publisher on npmjs.com)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$INPUT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "input version $INPUT_VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  publish:
    name: Publish to npm
    if: ${{ inputs.publish }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Provenance is generated automatically by trusted publishing; publishConfig also sets it.
      - run: npm publish
